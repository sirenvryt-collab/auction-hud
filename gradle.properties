minecraft_version=1.21.11
yarn_mappings=1.21.11+build.1
loader_version=0.18.3
fabric_version=0.141.2+1.21.11

# Mod properties
mod_version=1.0.0
maven_group=com.donutauction
archives_base_name=donut-auction-hud
